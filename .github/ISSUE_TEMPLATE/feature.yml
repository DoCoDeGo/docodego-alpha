name: Feature request
description: A gap the tool should fill.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do when you hit the gap — the problem first, not the solution.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: The workaround, if one exists.
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: Optional — a sketch, not a spec.
