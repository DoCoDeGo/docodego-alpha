name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The record layer is lf and branches are main: a crlf checkout would
      # poison the goldens, the payload drift gate, and every byte-exact
      # assertion, and an unset init.defaultBranch makes every scratch
      # `git init` in conformance print git's advice hint into the logs.
      - name: normalize git for the runner
        run: |
          git config --global core.autocrlf false
          git config --global init.defaultBranch main
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - name: install (workspaces + toolchain)
        run: pnpm install --frozen-lockfile
      - name: build — bundle → bump guard → drift verify → typecheck → smoke
        run: pnpm build
      - name: statutes mirror matches the canon (linux only — the mirror is byte-exact)
        if: runner.os == 'Linux'
        run: node --experimental-strip-types apps/cli/scripts/compile-statutes.ts --check
      - name: canon integrity — doctor (linux only — the tree is platform-blind)
        if: runner.os == 'Linux'
        run: node --experimental-strip-types apps/canon/src/main.ts doctor
      - name: conformance — the CLI proves itself against scratch records
        run: pnpm conformance
      - name: generated docs match their registries (linux only — the registries are platform-blind)
        if: runner.os == 'Linux'
        run: pnpm docs:verify
      - name: parser fuzz + ast goldens (linux only — the parser is platform-blind)
        if: runner.os == 'Linux'
        run: pnpm fuzz
