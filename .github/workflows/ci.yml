name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - name: install (workspaces + toolchain)
        run: npm install
      - name: build — bundle → bump guard → drift verify → typecheck → conformance → smoke
        run: npm run build
      - name: generated docs match their registries
        run: npm run docs:verify
      - name: parser fuzz + ast goldens
        run: npm run fuzz --if-present
