name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The record layer is lf; a crlf checkout would poison the goldens,
      # the payload drift gate, and every byte-exact assertion.
      - name: normalize line endings before checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - name: install (workspaces + toolchain)
        run: npm install
      - name: build — bundle → bump guard → drift verify → typecheck → smoke
        run: npm run build
      - name: conformance — the CLI proves itself against scratch records
        run: npm run conformance
      - name: generated docs match their registries
        run: npm run docs:verify
      - name: parser fuzz + ast goldens
        run: npm run fuzz --if-present
